name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same checks CONTRIBUTING.md asks for before every commit.
      - name: Unit tests, bundled data validation, syntax
        run: |
          set -euo pipefail
          node scripts/lib/lean-analysis.test.mjs
          node scripts/lib/rust-analysis.test.mjs
          node scripts/lib/canonical-map.test.mjs
          node scripts/lib/data-validation.test.mjs
          node scripts/lib/map-runtime.test.mjs
          node scripts/lib/map-toolbar.test.mjs
          node scripts/lib/trace-analysis.test.mjs
          node scripts/lib/run-runtime.test.mjs
          node scripts/lib/static-values.test.mjs
          node scripts/lib/i18n-locales.test.mjs
          node scripts/lib/csp-html.test.mjs
          node scripts/validate-data.mjs
          node scripts/validate-traces.mjs
          for f in map run header-nav site i18n theme-init; do node --check "assets/js/$f.js"; done

      # The map probe renders map.html in the runner's Chrome and asserts what
      # the unit tests cannot: the chart is drawn at 1:1 at every desktop
      # width, the sidebar placement, no sideways overflow, a clean console.
      # playwright-core is a test-time download, not a repository dependency.
      - name: Install playwright-core
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1

      - name: Code map smoke probe (headless Chrome)
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4173/map.html >/dev/null && break; sleep 0.2; done
          MAP_SMOKE_CHANNEL=chrome node scripts/map-smoke.mjs
