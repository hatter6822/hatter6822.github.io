name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a movable tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The same checks CONTRIBUTING.md asks for before every commit. The
      # data-sync workflow runs this script too, before it pushes.
      - name: Unit tests, bundled data validation, syntax
        run: ./scripts/check.sh

      # The two probes render the pages in the runner's Chrome and assert what
      # the unit tests cannot: for map.html, that the chart is drawn at 1:1 at
      # every desktop width, the sidebar placement, no sideways overflow and a
      # clean console; for index.html, that every stamped figure survives
      # hydration unchanged and no label is clipped.
      # playwright-core is a test-time download, not a repository dependency.
      - name: Install playwright-core
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1

      - name: Code map smoke probe (headless Chrome)
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4173/map.html >/dev/null && break; sleep 0.2; done
          MAP_SMOKE_CHANNEL=chrome node scripts/map-smoke.mjs

      - name: Landing page smoke probe (headless Chrome)
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4174/index.html >/dev/null && break; sleep 0.2; done
          INDEX_SMOKE_BASE=http://127.0.0.1:4174 INDEX_SMOKE_CHANNEL=chrome node scripts/index-smoke.mjs
