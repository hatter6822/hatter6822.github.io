name: Sync seLe4n Data

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  # Allow triggering from the seLe4n repo via repository_dispatch
  repository_dispatch:
    types: [sele4n-release]
  # Allow manual runs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The .mjs pipeline in scripts/ is the single source of truth for every
      # bundled snapshot. This job must not re-derive any metric itself — the
      # previous inline-bash version of this workflow drifted from the pipeline
      # (different module filters, LOC estimation, theorem grep) and never
      # refreshed map-data.json at all.
      - name: Refresh bundled data snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/sync-site-data.mjs
          node scripts/sync-map-data.mjs
          node scripts/sync-trace-data.mjs

      - name: Update static fallback values in index.html
        run: node scripts/apply-static-values.mjs

      - name: Validate snapshots
        run: |
          set -euo pipefail
          node scripts/validate-data.mjs
          node scripts/validate-traces.mjs

      - name: Run test suite
        run: |
          set -euo pipefail
          node scripts/lib/lean-analysis.test.mjs
          node scripts/lib/data-validation.test.mjs
          node scripts/lib/map-runtime.test.mjs
          node scripts/lib/map-toolbar.test.mjs
          node scripts/lib/trace-analysis.test.mjs
          node scripts/lib/run-runtime.test.mjs
          node scripts/lib/csp-html.test.mjs
          node scripts/lib/static-values.test.mjs

      - name: Check for changes and commit
        run: |
          set -euo pipefail
          if git diff --quiet index.html data/; then
            echo "No changes detected — website is already in sync."
            exit 0
          fi

          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('data/site-data.json','utf8')).version")
          THEOREMS=$(node -p "JSON.parse(require('fs').readFileSync('data/site-data.json','utf8')).theorems")
          MODULES=$(node -p "JSON.parse(require('fs').readFileSync('data/site-data.json','utf8')).modules")

          echo "### Changes detected" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff index.html data/site-data.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git commit -m "sync: update bundled data from seLe4n v${VERSION}

          Automated sync from GitHub Actions.
          Theorems: ${THEOREMS}
          Modules: ${MODULES}"
          git push
