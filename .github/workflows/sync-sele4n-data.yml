name: Sync seLe4n Data

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  # Allow triggering from the seLe4n repo via repository_dispatch
  repository_dispatch:
    types: [sele4n-release]
  # Allow manual runs
  workflow_dispatch:

# Nothing by default; the one job that pushes asks for write access itself.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to a commit, not a movable tag: this job can push to the
      # publishing branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # One pipeline, one upstream checkout, one revision. This job must not
      # re-derive any metric itself — the previous inline-bash version of this
      # workflow drifted from the pipeline (different module filters, LOC
      # estimation, theorem grep), and the three scripts that replaced it
      # drifted from each other, syncing at different commits. sync-upstream.mjs
      # uses the git protocol only, so it needs no token.
      - name: Refresh bundled data snapshots
        run: node scripts/sync-upstream.mjs

      # index.html and every locale bundle embed literal copies of the
      # metrics (data-i18n-html replaces innerHTML wholesale, so each locale
      # carries its own spans). All of them are stamped from the snapshot here.
      - name: Update static fallback values in index.html, locales and sitemap
        run: node scripts/apply-static-values.mjs

      # Exactly the checks CI runs (one shared script), then the same two
      # browser probes, all before the push. CI only runs after a push lands,
      # so a sync that skipped them could publish a page CI would reject.
      - name: Tiers 0-2 (unit tests, data validation, syntax)
        run: ./scripts/check.sh

      - name: Install playwright-core
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1

      - name: Browser probes (headless Chrome)
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4173/index.html >/dev/null && break; sleep 0.2; done
          INDEX_SMOKE_BASE=http://127.0.0.1:4173 INDEX_SMOKE_CHANNEL=chrome node scripts/index-smoke.mjs
          MAP_SMOKE_CHANNEL=chrome node scripts/map-smoke.mjs

      - name: Check for changes and commit
        run: |
          set -euo pipefail
          if git diff --quiet index.html sitemap.xml data/ locales/; then
            echo "No changes detected — website is already in sync."
            exit 0
          fi

          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('data/site-data.json','utf8')).version")
          THEOREMS=$(node -p "JSON.parse(require('fs').readFileSync('data/site-data.json','utf8')).theorems")
          MODULES=$(node -p "JSON.parse(require('fs').readFileSync('data/site-data.json','utf8')).modules")
          METRICS_SHA=$(node -p "JSON.parse(require('fs').readFileSync('data/site-data.json','utf8')).commitSha")

          echo "### Changes detected" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff index.html sitemap.xml data/site-data.json locales/ >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml data/ locales/
          git commit -m "sync: update bundled data from seLe4n v${VERSION}

          Automated sync from GitHub Actions.
          Projected from docs/codebase_map.json at ${METRICS_SHA}.
          Theorems: ${THEOREMS}
          Modules: ${MODULES}"
          git push
